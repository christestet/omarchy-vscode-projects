[package]
name = "omarchy-vscode-projects"
version = "0.5.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Fast, bounded VS Code project discovery for the Omarchy shell plugin"
repository = "https://github.com/christestet/omarchy-vscode-projects"
readme = "README.md"
publish = false

[[bin]]
name = "vsc-recent-projects"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.40", features = ["hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
